<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Find Recyclers | Waste2Value</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="page-recyclers">
    <header class="site-header inner-header">
      <div class="container nav-wrap">
        <a href="index.html" class="brand" aria-label="Waste2Value home">
          <span class="brand-mark">♻️</span>
          <span>Waste2Value</span>
        </a>

        <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="index.html">Home</a>
          <a href="dashboard.html">Dashboard</a>
          <a href="report.html">Report Waste</a>
          <a href="leaderboard.html">Leaderboard</a>
          <a href="profile.html">Profile</a>
          <a href="dashboard.html" class="btn btn-primary nav-cta">Dashboard</a>
        </nav>

        <button class="theme-toggle" type="button" aria-label="Toggle light and dark mode">🌙</button>
      </div>
    </header>

    <main class="page-container">
      <section class="section">
        <div class="container recycler-shell">
          <div class="section-heading recycler-head">
            <div>
              <span class="eyebrow text-green">Find Recyclers</span>
              <h1>Nearby collection partners</h1>
            </div>
          </div>

          <div class="recycler-toolbar">
            <div class="filter-group" aria-label="Recycler categories">
              <button class="filter-btn active" data-filter="All" type="button">All</button>
              <button class="filter-btn" data-filter="Plastic" type="button">Plastic</button>
              <button class="filter-btn" data-filter="Paper" type="button">Paper</button>
              <button class="filter-btn" data-filter="Metal" type="button">Metal</button>
              <button class="filter-btn" data-filter="Glass" type="button">Glass</button>
              <button class="filter-btn" data-filter="E-Waste" type="button">E-Waste</button>
            </div>

            <label class="search-box" for="recyclerSearch">
              <span>Search</span>
              <input id="recyclerSearch" type="search" placeholder="Search recycler or area" />
            </label>
          </div>

          <div id="recyclerList" class="recycler-grid" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <div id="pickupModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop" data-close-modal="true"></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="pickupModalTitle">
        <button class="modal-close" type="button" aria-label="Close pickup request modal">×</button>
        <h2 id="pickupModalTitle">Request Pickup</h2>

        <form id="pickupForm" novalidate>
          <div class="field-group">
            <label for="pickupWasteType">Waste type</label>
            <select id="pickupWasteType" name="pickupWasteType" required>
              <option value="">Select type</option>
              <option value="Plastic">Plastic</option>
              <option value="Paper">Paper</option>
              <option value="Metal">Metal</option>
              <option value="Glass">Glass</option>
              <option value="E-Waste">E-Waste</option>
              <option value="Organic">Organic</option>
            </select>
          </div>

          <div class="field-grid modal-grid">
            <div class="field-group">
              <label for="pickupQuantity">Quantity (KG)</label>
              <input id="pickupQuantity" name="pickupQuantity" type="number" min="1" step="1" required />
            </div>

            <div class="field-group">
              <label for="pickupDate">Pickup date</label>
              <input id="pickupDate" name="pickupDate" type="date" required />
            </div>
          </div>

          <div class="field-grid modal-grid">
            <div class="field-group">
              <label for="pickupTime">Pickup time</label>
              <input id="pickupTime" name="pickupTime" type="time" required />
            </div>

            <div class="field-group">
              <label for="pickupAddress">Address</label>
              <input id="pickupAddress" name="pickupAddress" type="text" required />
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block">Save Pickup Request</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
